<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Список пользователей</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">Список пользователей</h1>

    <div class="controls">
      <div class="controls__group">
        <label class="controls__label" for="age-filter">Только старше:</label>
        <input type="number" id="age-filter" class="controls__input" min="0" placeholder="18" />
      </div>

      <div class="controls__group">
        <span class="controls__label">Сортировка:</span>
        <button id="sort-asc" class="controls__btn">А → Я</button>
        <button id="sort-desc" class="controls__btn">Я → А</button>
      </div>
    </div>

    <ul id="users-list" class="user-list" role="list" aria-label="Список пользователей"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
